<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi tarjeta digital</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 18px;
    min-height: 100vh;
    background: linear-gradient(145deg, #F4F6F8, #FFFFFF);
    color: #222831;
    text-align: center;
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
}

.foto {
    display: block;
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 18px;
    border: 3px solid #FFFFFF;
    box-shadow: 0 6px 22px rgba(34, 40, 49, 0.15);
    margin: 8px auto 20px;
}

h1 {
    color: #222831;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 1.4px;
    margin: 12px 0 8px;
}

.subtitulo {
    color: #68717D;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.7px;
    line-height: 1.7;
    margin: 0 0 26px;
}

.boton {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    max-width: 390px;
    min-height: 58px;
    margin: 13px auto;
    padding: 16px 19px;
    background: #FFFFFF;
    color: #222831;
    border: 1px solid #DDE2E8;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(34, 40, 49, 0.05);
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
}

.boton:hover {
    transform: translateY(-2px);
    border-color: #00A884;
    box-shadow: 0 7px 18px rgba(34, 40, 49, 0.10);
}

.whatsapp {
    background: #00A884;
    color: #FFFFFF;
    border-color: #00A884;
}

.instagram {
    background: #222831;
    color: #FFFFFF;
    border-color: #222831;
}

.pie {
    margin: 30px auto 10px;
    color: #7A8490;
    font-family: Arial, sans-serif;
    font-size: 12px;
    line-height: 1.7;
}
</style>
</head>

<body>

<div class="contenedor">

    <div class="portada">

        <img src="CAT.jpg" class="foto">

        <h1>CRISTIAN TORRES</h1>

        <div class="subtitulo">
            DISTRIBUIDOR INDEPENDIENTE 
               OMNILIFE + SEYTÚ
        </div>

        <div class="frase">
           VISIONARY
        </div>

    </div>

    <a class="boton whatsapp"
       href="https://wa.me/542995053620"
       target="_blank">
       🟢 WhatsApp
    </a>

    <a class="boton"
       href="tel:+542995053620">
       📞 Llamarme
    </a>

    <a class="boton instagram"
       href="https://www.instagram.com/cristiantorres7604?utm_source=qr&stkn=MXBuYXZqZWFtY2gyYw=="
       target="_blank">
       📸 Instagram
    </a>
        <a class="boton"
       href="https://www.facebook.com/share/1NqcXrkXiR/"
       target="_blank" rel="noopener noreferrer">
       📘 Facebook
    </a>

    <a class="boton"
       href="https://portal.omnilife.com/registro?distributor_code=DAR0006001MGM&country_code=ARG&lang=es"
       target="_blank">
       🌐 WEB COMPANIA
    </a>

    <a class="boton"
       href="Catalogo_SEYTU_Argentina.pdf.pdf"
       target="_blank">
       📖 Ver catálogo
    </a>

    <div class="pie">
        Tarjeta digital · Contacto profesional
    </div>

</div>

</body>
</html>
