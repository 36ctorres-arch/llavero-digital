<style>

* {
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 18px;
    min-height: 100vh;
    background: linear-gradient(145deg, #F7F5F0, #FFFFFF 60%, #EDE8DE);
    color: #172B4D;
    text-align: center;
    font-family: "Segoe UI", Arial, sans-serif;
}

.foto {
    display: block;
    width: 145px;
    height: 145px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #C8A96B;
    box-shadow: 0 7px 22px rgba(23, 43, 77, 0.15);
    margin: 8px auto 20px;
}

h1 {
    color: #172B4D;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin: 12px 0 8px;
}

.subtitulo {
    color: #697586;
    font-size: 13px;
    letter-spacing: 0.8px;
    line-height: 1.7;
    margin: 0 0 26px;
}

.boton {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    max-width: 390px;
    min-height: 56px;
    margin: 13px auto;
    padding: 16px 21px;
    background: #FFFFFF;
    color: #172B4D;
    border: 1px solid #D8C69A;
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(23, 43, 77, 0.07);
    text-decoration: none;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
}

.boton:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(23, 43, 77, 0.13);
}

.whatsapp {
    background: #218C63;
    color: #FFFFFF;
    border-color: #218C63;
}

.instagram {
    background: #172B4D;
    color: #FFFFFF;
    border-color: #C8A96B;
}

.pie {
    margin: 30px auto 10px;
    color: #78818D;
    font-size: 12px;
    line-height: 1.7;
}
</style>
</head>

<body>

<div class="contenedor">
