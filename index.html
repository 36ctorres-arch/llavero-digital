<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi tarjeta digital</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 28px 16px;
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    background: linear-gradient(160deg, #F4F8F2, #FFFFFF 55%, #E7F0E5);
    color: #214E3D;
    text-align: center;
    min-height: 100vh;
}

.foto {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #D7E5D5;
    box-shadow: 0 6px 20px rgba(33, 78, 61, 0.16);
    margin: 8px auto 18px;
}

h1 {
    color: #214E3D;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 1.5px;
    margin: 12px 0 8px;
}

.subtitulo {
    color: #687D70;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    line-height: 1.6;
    margin: 0 0 24px;
}

.boton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    max-width: 380px;
    min-height: 54px;
    margin: 13px auto;
    padding: 15px 22px;
    border-radius: 999px;
    background: #FFFFFF;
    color: #214E3D;
    border: 1px solid #D7E5D5;
    box-shadow: 0 4px 12px rgba(33, 78, 61, 0.08);
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.boton:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(33, 78, 61, 0.14);
}

.whatsapp {
    background: #25D366;
    color: #FFFFFF;
    border-color: #25D366;
}

.instagram {
    background: #214E3D;
    color: #FFFFFF;
    border-color: #214E3D;
}

.pie {
    margin: 30px auto 10px;
    color: #78877C;
    font-family: Arial, sans-serif;
    font-size: 12px;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="contenedor">

    <div class="portada">

        <img src="CAT.jpg" class="foto">

        <h1>CRISTIAN TORRES</h1>

        <div class="subtitulo">
            DISTRIBUIDOR INDEPENDIENTE · OMNILIFE + SEYTÚ
        </div>

        <div class="frase">
            Contactame y hagamos crecer nuevas oportunidades.
        </div>

    </div>

    <a class="boton whatsapp"
       href="https://wa.me/542995053620"
       target="_blank">
       🟢 WhatsApp
    </a>

    <a class="boton"
       href="tel:+542995053620">
       📞 Llamarme
    </a>

    <a class="boton instagram"
       href="https://www.instagram.com/cristiantorres7604?utm_source=qr&stkn=MXBuYXZqZWFtY2gyYw=="
       target="_blank">
       📸 Instagram
    </a>
        <a class="boton"
       href="https://www.facebook.com/share/1NqcXrkXiR/"
       target="_blank" rel="noopener noreferrer">
       📘 Facebook
    </a>

    <a class="boton"
       href="https://portal.omnilife.com/registro?distributor_code=DAR0006001MGM&country_code=ARG&lang=es"
       target="_blank">
       🌐 WEB
    </a>

    <a class="boton"
       href="Catalogo_SEYTU_Argentina.pdf.pdf"
       target="_blank">
       📖 Ver catálogo
    </a>

    <div class="pie">
        Tarjeta digital · Contacto profesional
    </div>

</div>

</body>
</html>
