
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFF5E9">
<meta name="description" content="Tarjeta digital de Miriam Millaman. OMNILIFE y SEYTÚ.">
<title>Miriam Millaman | OMNILIFE + SEYTÚ</title>

<style>
:root {
    --fondo: #FFF5E9;
    --crema: #FFFAF5;
    --naranja: #F6D6C2;
    --terracota: #D9A18C;
    --terracota-claro: #F3E0D5;
    --marron: #80594F;
    --marron-suave: #A47D70;
    --verde: #E8EEE4;
    --verde-texto: #53664F;
    --borde: #EAD2C5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 16px 24px;
    min-height: 100vh;
    background:
        radial-gradient(ellipse at top, #FBE6D8 0%, transparent 58%),
        linear-gradient(145deg, #FFFAF5, #FFF1E6 55%, #F7E7E0);
    color: var(--marron);
    text-align: center;
    font-family: "Segoe UI", Arial, sans-serif;
}

.contenedor {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
}

.portada {
    padding: 28px 20px 22px;
    margin-bottom: 20px;
    background: linear-gradient(
        145deg,
        rgba(255, 250, 245, 0.97),
        rgba(246, 214, 194, 0.58)
    );
    border: 1px solid var(--borde);
    border-radius: 26px;
    box-shadow: 0 15px 38px rgba(128, 89, 79, 0.12);
}

.foto {
    display: block;
    width: 150px;
    height: 150px;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
    border: 4px solid #FFFAF5;
    outline: 2px solid var(--terracota);
    box-shadow: 0 8px 24px rgba(128, 89, 79, 0.16);
    margin: 4px auto 22px;
}

h1 {
    color: var(--marron);
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 1.4px;
    line-height: 1.3;
    margin: 10px 0;
}

.subtitulo {
    color: var(--marron-suave);
    font-size: 12px;
    letter-spacing: 1.2px;
    line-height: 1.9;
    margin: 0 0 20px;
}

.frase {
    padding-top: 14px;
    border-top: 1px solid #E5C4B4;
}

.frase h2 {
    color: #B77E68;
    font-size: 21px;
    letter-spacing: 5px;
    margin: 8px 0 4px;
}

.boton {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    max-width: 390px;
    min-height: 58px;
    margin: 13px auto;
    padding: 14px 19px;
    background: rgba(255, 250, 245, 0.94);
    color: var(--marron);
    border: 1px solid var(--borde);
    border-radius: 17px;
    box-shadow: 0 5px 14px rgba(128, 89, 79, 0.08);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
}

.boton:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 19px rgba(128, 89, 79, 0.14);
}

/* WHATSAPP: VERDE SUAVE */
.whatsapp {
    background: var(--verde);
    color: var(--verde-texto);
    border-color: #D2DFCC;
}

/* INSTAGRAM: ROSA TERRACOTA */
.instagram {
    background: #F6E4DB;
    color: #945F50;
    border-color: #EBCDBD;
}

/* FACEBOOK: CREMA CÁLIDO */
.facebook {
    background: #FFF1E5;
    color: #80594F;
    border-color: #EAD6C7;
}

/* WEB COMPAÑÍA: NARANJA PASTEL */
.web {
    background: #F6D6C2;
    color: #80594F;
    border-color: #E9C1AA;
}

/* CATÁLOGO: TERRACOTA SUAVE */
.catalogo {
    background: #E8BDA9;
    color: #70483D;
    border-color: #D9A18C;
}

.pie {
    margin: 28px auto 10px;
    color: var(--marron-suave);
    font-size: 10px;
    letter-spacing: 1px;
    line-height: 1.8;
}

@media (max-width: 380px) {
    body {
        padding: 20px 12px;
    }

    .portada {
        padding: 23px 15px 18px;
    }

    .foto {
        width: 130px;
        height: 130px;
    }

    h1 {
        font-size: 24px;
    }

    .boton {
        padding: 13px 14px;
        font-size: 14px;
    }
}
</style>
</head>

    </nav>

</html>
